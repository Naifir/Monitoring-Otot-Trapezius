<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Kelelahan Otot</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; padding: 16px; background: #f4f5f7; color: #1f2937; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-size: 14px; }
  button.sec { background: #6b7280; }
  button:disabled { background: #9ca3af; cursor: default; }
  #status { font-weight: 600; margin-left: auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .card small { color: #6b7280; font-size: 12px; }
  .card b { font-size: 22px; display: block; margin-top: 2px; }
  .chart { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  #log { background: #111827; color: #a7f3d0; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
         height: 160px; overflow: auto; padding: 8px; border-radius: 8px; white-space: pre-wrap; }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #e5e7eb; }
    .card, .chart { background: #1f2937; }
    .card small { color: #9ca3af; }
  }
</style>
</head>
<body>
<h1>Monitor Kelelahan Otot Trapezius</h1>

<div class="bar">
  <button id="btnConnect">Hubungkan ESP32</button>
  <button id="btnDisconnect" class="sec" disabled>Putuskan</button>
  <button id="btnCsv" class="sec">Simpan CSV</button>
  <button id="btnClear" class="sec">Bersihkan Grafik</button>
  <span id="status">Belum terhubung</span>
</div>

<div class="cards">
  <div class="card"><small>RMS sekarang</small><b id="cRms">-</b></div>
  <div class="card"><small>MDF sekarang (Hz)</small><b id="cMdf">-</b></div>
  <div class="card"><small>Baseline RMS</small><b id="cBRms">-</b></div>
  <div class="card"><small>Baseline MDF (Hz)</small><b id="cBMdf">-</b></div>
  <div class="card"><small>Mode / status</small><b id="cMode">-</b></div>
</div>

<div class="chart"><canvas id="rmsChart"></canvas></div>
<div class="chart"><canvas id="mdfChart"></canvas></div>

<div id="log"></div>

<script>
const MAX_POINTS = 300;
const DATA_RE  = /RMS:([\d.]+)\s+BatasRMS:([\d.]+)\s+MDF:([\d.]+)\s+BatasMDF:([\d.]+)/;
const BASE_RE  = /BASELINE\s+RMS:([\d.]+)\s+MDF:([\d.]+)/;
const MODE_RE  = /\[(\w+)\s+(\w+)\]/;

let port = null, reader = null, keepReading = false;
let n = 0;
let rows = [];
let baseRms = null, baseMdf = null;

const $ = id => document.getElementById(id);
const btnConnect = $('btnConnect'), btnDisconnect = $('btnDisconnect');

function makeChart(canvasId, title, color, batasColor) {
  return new Chart($(canvasId), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: title, data: [], borderColor: color, backgroundColor: color, pointRadius: 0, borderWidth: 2, tension: 0.2 },
        { label: 'Batas', data: [], borderColor: batasColor, borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5 }
      ]
    },
    options: {
      animation: false,
      responsive: true,
      scales: { x: { display: false }, y: { beginAtZero: false } },
      plugins: { legend: { position: 'bottom' } }
    }
  });
}

const rmsChart = makeChart('rmsChart', 'RMS (V-ADC)', '#2563eb', '#dc2626');
const mdfChart = makeChart('mdfChart', 'MDF (Hz)', '#059669', '#dc2626');

function setStatus(text) { $('status').textContent = text; }

function log(text) {
  const el = $('log');
  el.textContent += text + '\n';
  el.scrollTop = el.scrollHeight;
  if (el.textContent.length > 20000) el.textContent = el.textContent.slice(-10000);
}

function pushChart(chart, value, batas) {
  chart.data.labels.push(n);
  chart.data.datasets[0].data.push(value);
  chart.data.datasets[1].data.push(batas > 0 ? batas : null);
  if (chart.data.labels.length > MAX_POINTS) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(d => d.data.shift());
  }
  chart.update('none');
}

function addPoint(rms, bRms, mdf, bMdf) {
  n++;
  $('cRms').textContent = rms.toFixed(3);
  $('cMdf').textContent = mdf.toFixed(1);
  pushChart(rmsChart, rms, bRms);
  pushChart(mdfChart, mdf, bMdf);
  rows.push({ t: new Date().toISOString(), rms, bRms, mdf, bMdf });
}

function handleLine(line) {
  log(line);

  const base = line.match(BASE_RE);
  if (base) {
    baseRms = parseFloat(base[1]);
    baseMdf = parseFloat(base[2]);
    $('cBRms').textContent = baseRms.toFixed(3);
    $('cBMdf').textContent = baseMdf.toFixed(1);
    return;
  }

  const d = line.match(DATA_RE);
  if (d) {
    addPoint(parseFloat(d[1]), parseFloat(d[2]), parseFloat(d[3]), parseFloat(d[4]));
    const m = line.match(MODE_RE);
    if (m) $('cMode').textContent = m[1] + ' / ' + m[2];
    return;
  }

  if (line.startsWith('STATUS:')) {
    $('cMode').textContent = line.replace('STATUS:', '').trim().slice(0, 40);
  }
}

async function connect() {
  if (!('serial' in navigator)) {
    alert('Web Serial hanya didukung di Chrome atau Edge (akses via http://localhost).');
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    keepReading = true;
    btnConnect.disabled = true;
    btnDisconnect.disabled = false;
    setStatus('Terhubung');
    readLoop();
  } catch (e) {
    log('Gagal menghubungkan: ' + e.message);
  }
}

async function readLoop() {
  reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
  let buf = '';
  try {
    while (keepReading) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (line) handleLine(line);
      }
    }
  } catch (e) {
    log('Error baca: ' + e.message);
  } finally {
    try { reader.releaseLock(); } catch (_) {}
  }
}

async function disconnect() {
  keepReading = false;
  try { if (reader) await reader.cancel(); } catch (_) {}
  try { if (port) await port.close(); } catch (_) {}
  port = null;
  btnConnect.disabled = false;
  btnDisconnect.disabled = true;
  setStatus('Belum terhubung');
}

function saveCsv() {
  if (!rows.length) { alert('Belum ada data.'); return; }
  const head = 'waktu,rms,batas_rms,mdf,batas_mdf\n';
  const body = rows.map(r => [r.t, r.rms, r.bRms, r.mdf, r.bMdf].join(',')).join('\n');
  const blob = new Blob([head + body + '\n'], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'emg_' + new Date().toISOString().replace(/[:.]/g, '-') + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function clearChart() {
  n = 0;
  rows = [];
  [rmsChart, mdfChart].forEach(c => {
    c.data.labels = [];
    c.data.datasets.forEach(d => d.data = []);
    c.update('none');
  });
  log('-- grafik dibersihkan --');
}

btnConnect.addEventListener('click', connect);
btnDisconnect.addEventListener('click', disconnect);
$('btnCsv').addEventListener('click', saveCsv);
$('btnClear').addEventListener('click', clearChart);

if (!('serial' in navigator)) {
  setStatus('Web Serial tidak tersedia (gunakan Chrome/Edge)');
  btnConnect.disabled = true;
}
</script>
</body>
</html>
